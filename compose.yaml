services:
  mysql:
    image: 'mysql:8.0'
    environment:
      - 'MYSQL_DATABASE=allbutyou'
      - 'MYSQL_USER=app'
      - 'MYSQL_PASSWORD=app'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'TZ=Asia/Seoul'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_unicode_ci'
    ports:
      - '3307:3306'
